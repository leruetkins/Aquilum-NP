[package]
name = "vibecodium"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0"
rfd = "0.15"
uuid = { version = "1.23", features = ["v4"] }
pulldown-cmark = "0.13"
smallvec = "1"
arc-swap = "1"
semver = "1"
futures = "0.3"
rquickjs = "0.8"
ureq = { version = "2.10", features = ["json"] }
sha2 = "0.10"
memchr = "2"

[build-dependencies]
winres = "0.1"

# GPUI 0.2.2 is vendored (see vendor/gpui) with a one-line fix in the Windows
# frame loop. Upstream re-presents the cached scene on EVERY vsync tick for one
# second after the last input event ("to prevent the display from underclocking
# the refresh rate"). On Windows a present is not a cheap blit: it replays the
# whole scene on the GPU. A resting mouse that emits a couple of 1-2px jitters
# per second keeps that one-second window open permanently, so an idle, focused
# window re-renders the full scene 60-144 times per second (~20% GPU).
[patch.crates-io]
gpui = { path = "vendor/gpui" }

# In debug builds, optimize dependencies (GPUI, pulldown-cmark, etc.) so UI runs smoothly at 60-120 FPS
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

