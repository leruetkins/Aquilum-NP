[package]
name = "vibecodium"
version = "0.1.1"
edition = "2021"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0"
rfd = "0.15"
uuid = { version = "1.23", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
time = { version = "0.3", features = ["local-offset", "macros", "formatting", "parsing"] }
tiny-skia = "0.11"
cosmic-text = "0.14"
oxipng = { version = "9.1", default-features = false }
zip = { version = "2.6", default-features = false, features = ["deflate"] }
pulldown-cmark = "0.13"
smallvec = "1"
arc-swap = "1"
semver = "1"
futures = "0.3"
rquickjs = "0.8"
ureq = { version = "2.10", features = ["json"] }
sha2 = "0.10"
memchr = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
url = "2"
base64 = "0.22"
getrandom = "0.2"
crop = { version = "0.4", features = ["utf16-metric", "graphemes"] }
notify = "8"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = "0.15.1"
raw-window-handle = "0.6"

# libc 0.2.190 crashes on Linux. The lockfile alone keeps builds on 0.2.189,
# but an exact requirement stops `cargo update` from bumping it again. The
# Windows build does not compile this target at all.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

# Always-on-top sends an EWMH _NET_WM_STATE client message over the xcb
# connection GPUI already owns (allow-unsafe-code unlocks the raw FFI wrapper).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

# GPUI 0.2.2 is vendored (see vendor/gpui) with the following fixes.
#
# 1. Frame loop: upstream re-presents the cached scene on EVERY vsync tick for one
# second after the last input event ("to prevent the display from underclocking
# the refresh rate"). On Windows a present is not a cheap blit: it replays the
# whole scene on the GPU. A resting mouse that emits a couple of 1-2px jitters
# per second keeps that one-second window open permanently, so an idle, focused
# window re-renders the full scene 60-144 times per second (~20% GPU).
#
# 2. Alt+click: a bare Alt is no longer handed to DefWindowProcW. It opened the
# window menu loop, which consumed the following left click, so Alt+click never
# reached the editor (it reveals the whole inline markup of the clicked line).
# Alt+<key> combos still fall through, so Alt+F4/Alt+Space keep working.
#
# 3. Window frame (Windows 10): the client area covers the whole window rect
# instead of leaving the nonclient strip on the left, right and bottom. DWM drew
# its 1px frame line into that strip, which is why the window had a dark border
# on those three edges but not on top (the top inset was already zero). The
# frame is gone now: `get_client_area_insets` returns zero insets, the resize
# bands are served from the client edges in `handle_hit_test_msg` (all four
# sides and corners), resize NC mouse-downs are not offered to the view (a
# click handler under the pointer used to swallow them), and a resize band wins
# over the titlebar drag area while the window buttons keep priority. Since the
# removed frame also took the drop shadow with it, `DwmExtendFrameIntoClientArea`
# with 1px margins brings the shadow back without the frame line.
#
# 4. Cursor style: `WM_GPUI_CURSOR_STYLE_CHANGED` now calls `SetCursor` immediately.
# The old presence-only check never applied a change between two non-null cursors,
# so the icon kept the previous style until the next mouse move — visible when
# crossing a pointer/I-beam boundary, such as the inline rename field.
#
# 5. Text ellipsis: the text layout cache now keys on the truncation width as well,
# and every measure pass starts from the original runs. A nowrap label measured
# narrow before flex grew it kept that truncation forever — cut short and without
# the "…" — and re-measuring it with the final width sliced the runs at a
# non-char boundary (panic in the DirectWrite shaper).
#
# 6. X11 raw window handle: `HasWindowHandle` / `HasDisplayHandle` for `X11Window`
# were `unimplemented!()`, so the app could not reach the xcb window to set EWMH
# window state. They now return the XCB window id and the existing xcb
# connection, which `src/window_ops.rs` uses for always-on-top.
#
# 7. Windows window drag: `PlatformWindow::start_window_move` posts
# `WM_NCLBUTTONDOWN`/`HTCAPTION` instead of running `DefWindowProcW` inline.
# The inline call starts a modal move loop while a view callback still holds the
# app `RefCell`, so the next `WM_TIMER`/`WM_MOVE` panics with "RefCell already
# borrowed".
[patch.crates-io]
gpui = { path = "vendor/gpui" }

#[profile.release]
#lto = "thin"
#codegen-units = 1
#panic = "abort"
#strip = true

#[profile.release.package."*"]
#opt-level = "s"

# In debug builds, optimize dependencies (GPUI, pulldown-cmark, etc.) so UI runs smoothly at 60-120 FPS
[profile.dev]
opt-level = 1

#[profile.dev.package."*"]
#opt-level = 3

