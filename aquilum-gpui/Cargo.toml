[package]
name = "vibecodium"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0"
rfd = "0.15"
uuid = { version = "1.23", features = ["v4"] }
pulldown-cmark = "0.13"
smallvec = "1"

[build-dependencies]
winres = "0.1"

# In debug builds, optimize dependencies (GPUI, pulldown-cmark, etc.) so UI runs smoothly at 60-120 FPS
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

